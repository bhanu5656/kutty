<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutty AI | Personal Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fff5f7; --accent: #ff4d6d; --user-msg: #ff85a1; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-card { width: 100%; max-width: 400px; height: 90vh; background: white; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .chat-header { padding: 20px; text-align: center; border-bottom: 1px solid #eee; }
        .chat-header h1 { font-family: 'Dancing Script', cursive; margin: 0; color: var(--accent); }
        #chat-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px; border-radius: 15px; font-size: 0.9rem; }
        .ai { background: #f1f1f1; align-self: flex-start; }
        .user { background: var(--user-msg); color: white; align-self: flex-end; }
        .input-area { padding: 15px; display: flex; gap: 8px; border-top: 1px solid #eee; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
        button { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }
        #overlay { position: absolute; inset: 0; background: white; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="chat-card">
        <!-- Setup Screen -->
        <div id="overlay">
            <h2>Wake up Kutty AI</h2>
            <p>Paste your Gemini API Key below</p>
            <input type="password" id="api-key-input" placeholder="Enter Key Here...">
            <br>
            <button onclick="startKuttyAI()">Start Chat ❤️</button>
            <p style="font-size: 0.7rem; color: #888; margin-top: 20px;">If it doesn't work, check your browser console for errors.</p>
        </div>

        <div class="chat-header">
            <h1>Kutty AI</h1>
        </div>

        <div id="chat-window">
            <div class="msg ai">Kutty AI is ready! Tell me how you are feeling... 🌸</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type a message...">
            <button onclick="handleSend()">Send</button>
        </div>
    </div>

    <!-- USING THE LATEST RELIABLE LIBRARY -->
<script>
let API_KEY = "";
let chatHistory = [];

window.startKuttyAI = async () => {
    API_KEY = document.getElementById("api-key-input").value.trim();

    if (!API_KEY) {
        alert("Please paste your Gemini API key!");
        return;
    }

    document.getElementById("overlay").style.display = "none";
    addMsg("Kutty AI is awake! ❤️🌸", "ai");
};

window.handleSend = async () => {
    const input = document.getElementById("user-input");
    const message = input.value.trim();

    if (!message || !API_KEY) return;

    addMsg(message, "user");
    input.value = "";

    chatHistory.push({
        role: "user",
        parts: [{ text: message }]
    });

    try {
        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    contents: chatHistory,
                    systemInstruction: {
                        parts: [{
                            text: "Your name is Kutty AI. You are a loving, caring companion. Use emojis ❤️🌸✨."
                        }]
                    }
                })
            }
        );

        const data = await response.json();

        if (data.error) {
            throw new Error(data.error.message);
        }

        const reply =
            data.candidates[0].content.parts[0].text;

        chatHistory.push({
            role: "model",
            parts: [{ text: reply }]
        });

        addMsg(reply, "ai");

    } catch (err) {
        addMsg("❌ " + err.message, "ai");
    }
};

function addMsg(text, sender) {
    const win = document.getElementById("chat-window");
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.innerText = text;
    win.appendChild(div);
    win.scrollTop = win.scrollHeight;
}
</script>
</body>
</html>
